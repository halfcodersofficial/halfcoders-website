# Local PostgreSQL for development — `pnpm db:up` / `pnpm db:down`.
# Matches the DATABASE_URL and SHADOW_DATABASE_URL in .env.example
# (postgres / postgres on localhost:5432). Data lives in the named volume, so
# `db:down` keeps it; `docker compose -f docker-compose.dev.yml down -v` wipes it.
services:
  db:
    image: postgres:17-alpine
    container_name: halfcoders-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: halfcoders
    ports:
      # Only this machine can reach it.
      - "127.0.0.1:5432:5432"
    volumes:
      - halfcoders-pgdata:/var/lib/postgresql/data
    # Inline rather than a bind-mounted file: Docker Desktop can't see folders
    # outside the ones it shares (an external drive, say).
    configs:
      - source: postgres-init
        target: /docker-entrypoint-initdb.d/postgres-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d halfcoders"]
      interval: 2s
      timeout: 3s
      retries: 30

configs:
  # Runs once, when the volume is first created. The shadow database is the
  # empty scratch database `pnpm migrate <name>` needs.
  postgres-init:
    content: |
      CREATE DATABASE halfcoders_shadow;

volumes:
  halfcoders-pgdata:
